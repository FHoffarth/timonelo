[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timonelo"
version = "1.0.0"
description = "Cruise Intelligence Platform providing explainable, evidence-based answers about ships, cabins, routes and ports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Timonelo Engineering Team" }
]
keywords = [
    "cruise",
    "maritime",
    "intelligence",
    "evidence-based",
    "digital-twin",
    "spatial-reasoning"
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]
harvester = [
    "crawl4ai>=0.9.2",
    "playwright>=1.40.0"
]

[project.urls]
Homepage = "https://github.com/timonelo/timonelo"
Documentation = "https://github.com/timonelo/timonelo/tree/main/docs"
Repository = "https://github.com/timonelo/timonelo.git"

[tool.setuptools.packages.find]
where = ["src"]
