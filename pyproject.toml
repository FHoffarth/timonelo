[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timonelo"
version = "0.1.0"
description = "Independent cabin intelligence built from objective spatial evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
timonelo-knowledge-pack = "timonelo.knowledge_pack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

